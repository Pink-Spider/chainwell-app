<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@fontsource/chakra-petch/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/chakra-petch/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-kr/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-kr/500.css">
<style>
  html,body{margin:0;background:#0E0F16;overflow:hidden}
  #stage{position:relative;width:var(--w);height:var(--h);background:radial-gradient(120% 80% at 50% 0%,#1b1e2f 0%,#0E0F16 60%)}
  .title{position:absolute;left:0;right:0;top:var(--tt);text-align:center;color:#fff;font-family:"Noto Sans KR","Chakra Petch",sans-serif;font-weight:700;font-size:var(--ts);letter-spacing:-0.01em;line-height:1.15;padding:0 6%}
  .title.en{font-family:"Chakra Petch",sans-serif;letter-spacing:0.02em}
  .sub{position:absolute;left:0;right:0;top:var(--st);text-align:center;color:#9AA0B4;font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:var(--ss);letter-spacing:0.14em;text-transform:uppercase}
  .phone{position:absolute;left:50%;top:var(--pt);transform:translateX(-50%);width:var(--pw);border-radius:var(--pr);overflow:hidden;box-shadow:0 0 0 var(--pb) #25283A,0 60px 120px rgba(0,0,0,.6)}
  .phone img{display:block;width:100%}
</style></head>
<body><div id="stage"><div class="sub"></div><div class="title"></div><div class="phone"><img></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const w = +q.get('w'), h = +q.get('h'), lang = q.get('lang') || 'en';
  const s = document.getElementById('stage').style;
  s.setProperty('--w', w + 'px'); s.setProperty('--h', h + 'px');
  // layout in proportion to width
  const tall = h / w > 1.9;                // 1290x2796 (iOS) vs 1080x1920 (Play)
  const ts = Math.round(w * (tall ? 0.062 : 0.068)), ss = Math.round(w * 0.022);
  s.setProperty('--ts', ts + 'px'); s.setProperty('--ss', ss + 'px');
  s.setProperty('--st', Math.round(h * 0.055) + 'px'); s.setProperty('--tt', Math.round(h * 0.085) + 'px');
  const pw = Math.round(w * (tall ? 0.84 : 0.66));
  s.setProperty('--pw', pw + 'px'); s.setProperty('--pt', Math.round(h * (tall ? 0.2 : 0.21)) + 'px');
  s.setProperty('--pr', Math.round(pw * 0.09) + 'px'); s.setProperty('--pb', Math.round(pw * 0.012) + 'px');
  const t = document.querySelector('.title'); t.textContent = q.get('title') || ''; t.classList.toggle('en', lang === 'en');
  document.querySelector('.sub').textContent = q.get('sub') || '';
  document.querySelector('.phone img').src = q.get('img');
</script></body></html>
